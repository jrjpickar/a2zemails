[build]
command = "pnpm build"
publish = "dist"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'self' https://app.gohighlevel.com; form-action 'self'"
