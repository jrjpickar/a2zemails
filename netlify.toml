[build]
command = "pnpm build"
publish = "dist"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.r2.cloudflarestorage.com; img-src 'self' data: blob: https:; object-src 'none'; base-uri 'none'; frame-src blob:; frame-ancestors 'self' https://app.gohighlevel.com; form-action 'self'"
